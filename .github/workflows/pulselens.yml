name: PulseLens Android APK
on:
  push:
    branches:
      - pulselens-android
    paths:
      - 'pulselens/**'
      - '.github/workflows/pulselens.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        working-directory: pulselens
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseLens-debug-APK
          path: pulselens/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
