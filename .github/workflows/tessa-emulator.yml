name: TESSA Android emulator smoke test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tessa-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tessa-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug APK
        working-directory: tessa/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install visual regression dependency
        run: python3 -m pip install --quiet pillow
      - name: Launch emulator, install, verify lifecycle and UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            mkdir -p tessa-smoke
            adb install -r tessa/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.tessa.remote/.MainActivity
            sleep 12
            test -n "$(adb shell pidof com.tessa.remote)"
            adb shell pidof com.tessa.remote > tessa-smoke/pid-before.txt
            adb exec-out screencap -p > tessa-smoke/portrait.png
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell am start -n com.tessa.remote/.MainActivity
            sleep 4
            test -n "$(adb shell pidof com.tessa.remote)"
            adb shell pidof com.tessa.remote > tessa-smoke/pid-after.txt
            cmp -s tessa-smoke/pid-before.txt tessa-smoke/pid-after.txt
            adb exec-out screencap -p > tessa-smoke/restored.png
            # No Android OEM gray/opaque bars on dark glass surface.
            python3 -c "from PIL import Image; i=Image.open('tessa-smoke/restored.png').convert('RGB'); w,h=i.size; t=i.getpixel((w//2,18)); b=i.getpixel((w//5,h-18)); print('status pixel',t,'navigation pixel',b); assert max(t)-min(t)>3 and max(b)-min(b)>3, f'opaque gray system bars still present: {t} {b}'"
            # Repeated background/foreground transitions must not restart the process.
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am start -n com.tessa.remote/.MainActivity
            sleep 2
            adb shell pidof com.tessa.remote > tessa-smoke/pid-third.txt
            cmp -s tessa-smoke/pid-before.txt tessa-smoke/pid-third.txt
            adb shell input tap 540 1460
            sleep 1
            adb exec-out screencap -p > tessa-smoke/orb-tap.png
            adb shell input tap 70 180
            sleep 3
            # Android first-run immersive confirmation overlay; dismiss the native system tutorial.
            adb shell input tap 1700 510
            sleep 3
            adb exec-out screencap -p > tessa-smoke/fullscreen.png
            # Click the dedicated screen-visible exit button in landscape.
            adb shell input tap 95 100
            sleep 5
            adb exec-out screencap -p > tessa-smoke/returned.png
            adb shell input tap 995 182
            sleep 2
            adb exec-out screencap -p > tessa-smoke/settings.png
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell dumpsys activity activities | grep 'com.tessa.remote' > tessa-smoke/activity.txt || true
            adb logcat -d -t 4000 > tessa-smoke/logcat.txt
            ! grep -A 4 'FATAL EXCEPTION' tessa-smoke/logcat.txt | grep -q 'com.tessa.remote'
            test -s tessa-smoke/portrait.png
            test -s tessa-smoke/restored.png
            test -s tessa-smoke/fullscreen.png
            python3 -c "import struct; f=open('tessa-smoke/fullscreen.png','rb'); f.seek(16); w,h=struct.unpack('>II',f.read(8)); assert w>h, f'Expected landscape fullscreen, got {w}x{h}'"
            python3 -c "import struct; f=open('tessa-smoke/returned.png','rb'); f.seek(16); w,h=struct.unpack('>II',f.read(8)); assert h>w, f'Expected portrait after Android Back, got {w}x{h}'"
      - name: Upload smoke screenshot and device log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TESSA-emulator-smoke
          path: tessa-smoke
          if-no-files-found: warn
