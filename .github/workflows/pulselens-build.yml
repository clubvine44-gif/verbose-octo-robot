name: PulseLens Android APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pulselens-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-pulselens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PulseLens isolated branch
        uses: actions/checkout@v4
        with:
          ref: pulselens-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: pulselens
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseLens-debug-APK
          path: pulselens/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
