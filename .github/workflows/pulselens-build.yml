name: PulseLens APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pulselens-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-pulselens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated source branch
        uses: actions/checkout@v4
        with:
          ref: pulselens-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled cmdline-tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: pulselens
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate output archive
        run: |
          test -s pulselens/app/build/outputs/apk/debug/app-debug.apk
          unzip -t pulselens/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseLens-debug-APK
          path: pulselens/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pulselens-v2.0.0
          name: PulseLens v2.0.0 (experimental)
          body: "Experimental optical pulse monitor with improved signal quality. Not an ECG or diagnostic device. APK is debug signed."
          files: pulselens/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
