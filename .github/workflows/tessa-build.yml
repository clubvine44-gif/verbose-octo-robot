name: TESSA Android Preview APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tessa-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-tessa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated TESSA source branch
        uses: actions/checkout@v4
        with:
          ref: tessa-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python protocol, bridge imports and routes
        run: |
          python -m pip install 'aiohttp>=3.10,<4' 'Pillow>=10,<13'
          python -m compileall -q tessa/pc
          python -m unittest discover -s tessa/pc -p 'test_*.py' -v
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tessa/pc')
          from server import create_app
          app = create_app('x' * 40)
          assert {'/ws', '/audio', '/stream', '/health'}.issubset({r.resource.canonical for r in app.router.routes()})
          print('Bridge route contract verified')
          PY
      - name: Validate embedded Android JavaScript
        run: |
          python - <<'PY'
          import pathlib
          page = pathlib.Path('tessa/android/app/src/main/assets/ui.xml').read_text(encoding='utf-8')
          assert '<script>' in page and '</script>' in page
          pathlib.Path('/tmp/tessa-ui.js').write_text(page.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/tessa-ui.js
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android APK
        working-directory: tessa/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK archive integrity
        run: |
          test -s tessa/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t tessa/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload preview APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TESSA-preview-debug-APK
          path: tessa/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish preview build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tessa-v0.1.7-preview
          name: TESSA Android v0.1.7 preview
          body: "Animated sculptural glass UI, real Android layout diagnostics, isolated transport integration tests; Android preview UI and transport client. PC streaming/remote-control server and end-to-end performance remain under development. Debug-signed APK, not a production release."
          files: tessa/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
